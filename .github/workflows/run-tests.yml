name: Run Tests

on:
  push:
    paths:
      - "src/**"
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    name: Set up services and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run CheckStyle
        run: mvn checkstyle:checkstyle

      - name: Start infra services
        run: docker compose -f infra/docker-compose.yml up -d --pull always backend frontend nginx selenoid

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail

          wait_http() {
            local url=$1
            local label=$2
            local max_attempts=${3:-45}
            local i=0

            echo ">>> waiting: $label"

            while (( i++ < max_attempts )); do
              if curl -sS --connect-timeout 2 --max-time 8 -o /dev/null "$url"; then
                echo ">>> ready: $label"
                return 0
              fi
              printf '.'
              sleep 2
            done

            echo ""
            echo "timeout waiting for $label"
            docker compose -f infra/docker-compose.yml logs --tail=200
            exit 1
          }

          wait_http "http://127.0.0.1:4111/" "backend"
          wait_http "http://127.0.0.1/" "nginx"
          wait_http "http://127.0.0.1:4444/wd/hub/status" "selenium"

      - name: Run API tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://localhost
          SWAGGER_COVERAGE_OUTPUT: swagger-coverage-output
        run: mvn -B test -P api -Dallure.results.directory=target/allure-results

      - name: Run UI tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://nginx
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: mvn -B test -P ui -Dallure.results.directory=target/allure-results

      - name: Install jq
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq

      - name: Load gh-pages history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Build Allure report
        if: always()
        run: |
          set -euo pipefail
          mkdir -p target/allure-results/history

          LATEST=$(ls -d gh-pages/test-report/*/ 2>/dev/null | sort -t'/' -k3 -nr | head -1 || true)

          if [ -n "$LATEST" ] && [ -d "${LATEST}allure-report/history" ]; then
            cp -r "${LATEST}allure-report/history/"* target/allure-results/history/ || true
          fi

          mvn -B allure:report

      # =========================
      # SWAGGER COVERAGE FIXED
      # =========================
      - name: Download Swagger Coverage CLI
        shell: bash
        run: |
          set -euo pipefail

          VER="1.5.0"

          curl -L -o swagger-coverage.zip \
            https://github.com/viclovsky/swagger-coverage/releases/download/${VER}/swagger-coverage-${VER}.zip

          unzip -o swagger-coverage.zip
          chmod +x swagger-coverage-commandline || true

      - name: Run Swagger coverage
        shell: bash
        run: |
          set -euo pipefail

          rm -f swagger-coverage-report.html swagger-coverage-results.json

          if [ ! -d "swagger-coverage-output" ]; then
            echo "ERROR: swagger-coverage-output not found"
            exit 1
          fi

          SC_BIN=$(find . -maxdepth 4 -type f -name "swagger-coverage-commandline" | head -1)

          if [ -z "$SC_BIN" ]; then
            echo "ERROR: swagger CLI not found"
            exit 1
          fi

          chmod +x "$SC_BIN"

          "$SC_BIN" \
            -s http://localhost:4111/v3/api-docs \
            -i swagger-coverage-output

          echo "Swagger coverage completed"

      - name: Push dockerHub
        run: bash ./push-tests.sh
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}

      - name: Prepare test report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          RUN_NUM="${{ github.run_number }}"

          rm -rf pages-publish
          mkdir -p pages-publish/test-report

          mkdir -p "pages-publish/test-report/$RUN_NUM/allure-report"
          mkdir -p "pages-publish/test-report/$RUN_NUM/swagger-coverage"

          cp -r target/site/allure-maven-plugin/* "pages-publish/test-report/$RUN_NUM/allure-report/" 2>/dev/null || true

          [ -f swagger-coverage-report.html ] && \
            cp swagger-coverage-report.html "pages-publish/test-report/$RUN_NUM/swagger-coverage/"

          [ -f swagger-coverage-results.json ] && \
            cp swagger-coverage-results.json "pages-publish/test-report/$RUN_NUM/swagger-coverage/"

      - name: Publish to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages-publish

      - name: Shutdown infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down