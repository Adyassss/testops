name: Run Tests

on: [push, workflow_dispatch]

jobs:
  run-tests:
    name: Set up services and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run CheckStyle with Maven
        run: mvn checkstyle:checkstyle

      - name: Start infra services
        run: docker compose -f infra/docker-compose.yml up -d --pull always backend frontend nginx selenoid

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          wait_http() {
            local url=$1
            local label=$2
            local max_attempts=${3:-45}
            local i=0
            while (( i++ < max_attempts )); do
              if curl -sS --connect-timeout 2 --max-time 8 -o /dev/null "$url"; then
                echo "$label ready"
                return 0
              fi
              sleep 2
            done
            exit 1
          }

          wait_http "http://127.0.0.1:4111/" "backend"
          wait_http "http://127.0.0.1/" "nginx"
          wait_http "http://127.0.0.1:4444/wd/hub/status" "selenium"

      - name: Run API tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://localhost
        run: mvn -B test -P api

      - name: Run UI tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://nginx
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: mvn -B test -P ui

      - name: Dump surefire reports on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo ">>> surefire-reports listing"
          ls -la target/surefire-reports || true
          echo ">>> last 200 lines of each *.txt (if any)"
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            tail -n 200 "$f" || true
          done

      - name: Push dockerHub
        run: bash ./push-tests.sh
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}

      # Swagger coverage
      - name: Run Swagger coverage
        if: always()
        run: |
          curl -L -o swagger.zip https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-commandline-1.5.0.zip
          unzip -q swagger.zip
          ./swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i target/swagger-coverage-output \
            -o swagger-coverage-report.html

      # Allure report
      - name: Build Allure report
        if: always()
        run: mvn allure:report

      # Prepare gh-pages
      - name: Prepare reports
        if: always()
        run: |
          mkdir -p gh-pages

          if [ -d target/site/allure-maven-plugin ]; then
            cp -r target/site/allure-maven-plugin/* gh-pages/
          fi

          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html gh-pages/coverage.html
          fi

      # Publish to gh-pages
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: gh-pages

      # Shutdown infra
      - name: Shutdown infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down