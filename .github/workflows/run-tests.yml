name: Run tests

on: [ push, workflow_dispatch ]

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- checkout ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- java ---
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --- maven cache ---
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # --- install jq ---
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # --- checkstyle ---
      - name: Run CheckStyle
        run: mvn checkstyle:checkstyle

      # --- infra ---
      - name: Start infra
        run: docker compose -f infra/docker-compose.yml up -d --pull always backend frontend nginx selenoid

      # --- wait services ---
      - name: Wait for services
        run: |
          set -e
          wait() {
            for i in {1..40}; do
              curl -s "$1" && return 0
              sleep 2
            done
            echo "Service not ready: $1"
            exit 1
          }

          wait http://localhost:4111
          wait http://localhost
          wait http://localhost:4444/wd/hub/status

      # --- tests ---
      - name: Run API tests
        run: mvn -B test -P api
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://localhost

      - name: Run UI tests
        run: mvn -B test -P ui
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://nginx
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub

      # --- docker push ---
      - name: Push dockerHub
        run: bash ./push-tests.sh
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}

      # --- swagger coverage ---
      - name: Run Swagger coverage
        if: always()
        run: |
          curl -L -o swagger.zip https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-1.5.0.zip
          unzip -o swagger.zip

          SC_BIN=$(find . -type f -name "swagger-coverage-commandline" | head -1)
          chmod +x $SC_BIN

          $SC_BIN \
            -s http://localhost:4111/v3/api-docs \
            -i swagger-coverage-output

      # --- allure ---
      - name: Build Allure report
        if: always()
        run: |
          mvn allure:report
          mkdir -p allure-history
          cp -r target/site/allure-maven-plugin/* allure-history/ || true

      # --- prepare gh-pages ---
      - name: Prepare reports
        if: always()
        run: |
          RUN=${{ github.run_number }}

          mkdir -p pages-publish/test-report/$RUN/allure-report
          mkdir -p pages-publish/test-report/$RUN/swagger-coverage

          cp -r allure-history/* pages-publish/test-report/$RUN/allure-report/ 2>/dev/null || true
          cp swagger-coverage-report.html pages-publish/test-report/$RUN/swagger-coverage/ 2>/dev/null || true
          cp swagger-coverage-results.json pages-publish/test-report/$RUN/swagger-coverage/ 2>/dev/null || true

      # --- index ---
      - name: Create index
        if: always()
        run: |
          mkdir -p pages-publish
          echo "<h1>Reports</h1>" > pages-publish/index.html

          for d in pages-publish/test-report/*; do
            run=$(basename $d)
            echo "<p>Run $run:
              <a href=\"test-report/$run/allure-report/index.html\">Allure</a> |
              <a href=\"test-report/$run/swagger-coverage/swagger-coverage-report.html\">Swagger</a>
            </p>" >> pages-publish/index.html
          done

      # --- publish ---
      - name: Publish to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pages-publish

      # --- cleanup ---
      - name: Shutdown infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down