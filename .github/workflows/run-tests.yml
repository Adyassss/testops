name: Run Tests

on: [ push, workflow_dispatch ]

permissions:
  contents: write

jobs:
  run-tests:
    name: Set up services and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run CheckStyle with Maven
        run: mvn checkstyle:checkstyle

      - name: Start infra services
        run: docker compose -f infra/docker-compose.yml up -d --pull always backend frontend nginx selenoid

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          wait_http() {
            local url=$1
            local label=$2
            local max_attempts=${3:-45}
            local i=0
            while (( i++ < max_attempts )); do
              if curl -sS --connect-timeout 2 --max-time 8 -o /dev/null "$url"; then
                echo "$label ready"
                return 0
              fi
              sleep 2
            done
            exit 1
          }

          wait_http "http://127.0.0.1:4111/" "backend"
          wait_http "http://127.0.0.1/" "nginx"
          wait_http "http://127.0.0.1:4444/wd/hub/status" "selenium"

      - name: Run API tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://localhost
        run: mvn -B test -P api

      - name: Run UI tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://nginx
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: mvn -B test -P ui


      - name: Push dockerHub
        run: bash ./push-tests.sh
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}

      - name: Run Swagger coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o swagger.zip "https://github.com/viclovsky/swagger-coverage/releases/download/1.5.0/swagger-coverage-commandline-1.5.0.zip"
          unzip -q swagger.zip
          rm -rf .swagger-coverage-commandline
          mv swagger-coverage-commandline .swagger-coverage-commandline
          chmod +x .swagger-coverage-commandline/bin/swagger-coverage-commandline 2>/dev/null || true
          .swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost:4111/v3/api-docs \
            -i target/swagger-coverage-output

      - name: Load test report history
        if: always()
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Prepare Allure history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* target/allure-results/history/ || true
          fi

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Prepare publish directory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf allure-history
          mkdir -p allure-history

          # Preserve previously published reports (including per-run folders).
          if [ -d gh-pages ]; then
            cp -r gh-pages/* allure-history/ || true
          fi

          mkdir -p "allure-history/${{ github.run_number }}"

          if [ -d target/site/allure-maven-plugin ]; then
            # Latest report in the root
            cp -r target/site/allure-maven-plugin/* allure-history/
            # Also keep a per-run copy (as in the lesson)
            cp -r target/site/allure-maven-plugin/* "allure-history/${{ github.run_number }}/"
          else
            echo "Allure report not found at target/site/allure-maven-plugin"
          fi

          # swagger-coverage generates HTML in repo root by default
          if [ -f swagger-coverage-report.html ]; then
            cp swagger-coverage-report.html allure-history/swagger-coverage-report.html
            cp swagger-coverage-report.html "allure-history/${{ github.run_number }}/swagger-coverage-report.html"
          fi

          echo "Allure latest: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Allure this run: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/"
          {
            echo "Allure (latest): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "Allure (this run): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Shutdown infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down
