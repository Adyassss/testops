name: Run Tests

on:
  push:
    paths:
      - "src/**"
      - "pom.xml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    name: Set up services and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
            

      - name: Run CheckStyle with Maven
        run: mvn checkstyle:checkstyle

      - name: Start infra services
        run: docker compose -f infra/docker-compose.yml up -d --pull always backend frontend nginx selenoid

      - name: Wait for services
        shell: bash
        run: |
          set -euo pipefail
          wait_http() {
            local url=$1
            local label=$2
            local max_attempts=${3:-45}
            local i=0
            echo ">>> waiting: $label"
            while (( i++ < max_attempts )); do
              if curl -sS --connect-timeout 2 --max-time 8 -o /dev/null "$url" 2>/dev/null; then
                echo ">>> ready: $label"
                return 0
              fi
              printf ' .'
              sleep 2
            done
            echo ""
            echo "timeout waiting for $label ($url)"
            docker compose -f infra/docker-compose.yml ps
            docker compose -f infra/docker-compose.yml logs --no-color --tail=200
            exit 1
          }
          wait_http "http://127.0.0.1:4111/" "backend :4111"
          wait_http "http://127.0.0.1/" "nginx :80"
          wait_http "http://127.0.0.1:4444/wd/hub/status" "selenium :4444"

      - name: Run API tests
        env:
          NBANK_SERVER: http://localhost:4111
          NBANK_BASE_URL: http://localhost
        run: mvn -B test -P api -Dallure.results.directory=target/allure-results

      - name: Run UI tests
        env:
          NBANK_SERVER: http://localhost:4111
          # UI opens in a remote browser container (selenium). For that container,
          # "localhost" points to itself, not the GitHub runner. Use docker-compose service name.
          NBANK_BASE_URL: http://nginx
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: mvn -B test -P ui -Dallure.results.directory=target/allure-results

      - name: Load gh-pages for Allure history
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Prepare Allure history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/allure-results/history
          if [ -d gh-pages/history ]; then
            cp -r gh-pages/history/* target/allure-results/history/ 2>/dev/null || true
          fi

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Prepare gh-pages payload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          RUN_NUM="${{ github.run_number }}"
          rm -rf allure-history
          mkdir -p allure-history

          # Preserve previous published reports.
          if [ -d gh-pages ]; then
            cp -r gh-pages/* allure-history/ 2>/dev/null || true
          fi

          # Publish latest in the root, and archive by run number.
          mkdir -p "allure-history/${RUN_NUM}"
          if [ -d target/site/allure-maven-plugin ]; then
            cp -r target/site/allure-maven-plugin/* allure-history/
            cp -r target/site/allure-maven-plugin/* "allure-history/${RUN_NUM}/"
          else
            echo "Allure report dir not found"
          fi

          echo "Allure (latest): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"
          echo "Allure (this run): https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${RUN_NUM}/" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Allure to gh-pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Dump surefire reports on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo ">>> surefire-reports listing"
          ls -la target/surefire-reports || true
          echo ">>> last 200 lines of each *.txt (if any)"
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            echo "===== $f ====="
            tail -n 200 "$f" || true
          done

      - name: Push dockerHub
        run: bash ./push-tests.sh
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          TAG: ${{ github.sha }}

      - name: Shutdown infra
        if: always()
        run: docker compose -f infra/docker-compose.yml down
